services:
  php:
    build: ./docker/php
    volumes:
      - ./src:/var/www/html
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    ports:
      - 8081:8080

  node:
    image: node:20
    working_dir: /app
    volumes:
      - ./src:/app
    command: npm run dev
    ports:
      - "5173:5173"

  redis:
    image: redis:7

volumes:
  postgres_data:
